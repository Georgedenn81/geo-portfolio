name: Checa mídia do portfólio

# Roda a cada push (inclusive publicações do admin) e confere se toda
# imagem/vídeo referenciado no portfolio.html existe no repositório e
# não está excluído do deploy pelo .vercelignore. Se algo estiver
# quebrado, o workflow falha e o GitHub avisa por e-mail.

on:
  push:
    branches: [main]

jobs:
  checa-midia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confere referências de mídia
        run: python3 scripts/checa_midia.py
